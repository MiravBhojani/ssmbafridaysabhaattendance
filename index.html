<html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#B85F0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap">
<style>
/* Layout: one quiet first screen with a small title and a corner menu, four outlined group boxes, then a names-by-Fridays sheet with a sticky name column and very narrow date columns; everything else lives in bottom sheets opened from the menu. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#1B1F33; --muted:#666B85; --line:#E0E3EE; --field:#F6F7FB;
  --on-accent:#FFFFFF;
  --dharma:#B85F0E; --dharma-soft:#FBEBD9;
  --gnan:#2A62C0; --gnan-soft:#E2EBFA;
  --vairagya:#1F7A6A; --vairagya-soft:#D8EFE9;
  --bhakti:#B53A6E; --bhakti-soft:#F8E1EC;
  --rv:#B45309; --rl:#BE185D; --warn:#9A3412; --warn-soft:#FDEBDD; --ok:#17603F; --ok-soft:#DDF3E7;
  --display:"Baloo Bhai 2","Noto Sans Gujarati","Shruti",system-ui,sans-serif;
  --body:"Noto Sans Gujarati","Shruti",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1222; --surface:#181C34; --ink:#ECEEF8; --muted:#9AA0BC; --line:#2A2F4D; --field:#1F2442;
    --on-accent:#12152A;
    --dharma:#F0A24F; --dharma-soft:#3B2A16;
    --gnan:#7AA9F7; --gnan-soft:#1C2C4D;
    --vairagya:#5CC8B0; --vairagya-soft:#14372F;
    --bhakti:#F286AE; --bhakti-soft:#46202F;
    --rv:#FFB45C; --rl:#F78BC4; --warn:#F5B58A; --warn-soft:#3A2417; --ok:#7FDDA9; --ok-soft:#173826;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1222; --surface:#181C34; --ink:#ECEEF8; --muted:#9AA0BC; --line:#2A2F4D; --field:#1F2442;
  --on-accent:#12152A;
  --dharma:#F0A24F; --dharma-soft:#3B2A16;
  --gnan:#7AA9F7; --gnan-soft:#1C2C4D;
  --vairagya:#5CC8B0; --vairagya-soft:#14372F;
  --bhakti:#F286AE; --bhakti-soft:#46202F;
  --rv:#FFB45C; --rl:#F78BC4; --warn:#F5B58A; --warn-soft:#3A2417; --ok:#7FDDA9; --ok-soft:#173826;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);padding-inline:16px;padding-block:14px 48px}
.wrap{max-width:1100px;margin-inline:auto}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--a,var(--ink));outline-offset:2px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
h1{font:800 24px/1.15 var(--display);margin:0}
.sub{margin:0;color:var(--muted);font-size:13px}
.hb{display:flex;align-items:center;gap:8px;flex:none}
.lang{height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;padding:3px;gap:2px;cursor:pointer;font:inherit;color:var(--ink)}
.lang span{min-width:30px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);padding-inline:6px}
.lang .l1{background:var(--ink);color:var(--surface)}
.lang.en .l1{background:none;color:var(--muted)}
.lang.en .l2{background:var(--ink);color:var(--surface)}
.cardbtn{width:100%;height:44px;border:0;border-radius:14px;background:var(--dharma);color:var(--on-accent);font-weight:700;font-size:16px;cursor:pointer;margin-bottom:4px;font-family:inherit}
.nbtn.bk{width:auto;height:36px;padding-inline:14px;font-size:14px;font-weight:600;white-space:nowrap}
.cardmeta{display:grid;gap:8px;margin-top:10px}
.kebab{flex:none;width:44px;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.kebab span{width:4px;height:4px;border-radius:50%;background:var(--ink)}

.note{margin-bottom:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}

.g-dharma{--a:var(--dharma);--a-soft:var(--dharma-soft)}
.g-gnan{--a:var(--gnan);--a-soft:var(--gnan-soft)}
.g-vairagya{--a:var(--vairagya);--a-soft:var(--vairagya-soft)}
.g-bhakti{--a:var(--bhakti);--a-soft:var(--bhakti-soft)}

.ptabs{margin:10px 10px 0}
.gtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gtab{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:42px;padding:6px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;min-width:0}
.gtn{font:800 17px/1.1 var(--display)}
.gtc{font-size:11px;font-weight:600;color:var(--muted)}
.gtab[aria-selected="true"]{background:var(--a);border-color:var(--a);color:var(--on-accent)}
.gtab[aria-selected="true"] .gtc{color:var(--on-accent)}

.tw{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gx{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content}
.gx th.t,.gx td.t{position:sticky;right:0;z-index:2;width:44px;min-width:44px;background:var(--field);color:var(--a);font-weight:800;font-size:14px;border-right:0;box-shadow:-1px 0 0 var(--line)}
.gx th.t{font-size:11px;color:var(--muted)}
@media (orientation:landscape) and (max-height:520px){.nb,.bx{min-height:38px;height:38px}.gx th{height:40px}}
.gx th,.gx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.gx tbody tr:last-child td{border-bottom:0}
.gx th{background:var(--field);color:var(--muted);font-weight:700;height:46px;vertical-align:middle}
.gx th.s,.gx td.s{position:sticky;left:0;z-index:3;width:26px;min-width:26px;max-width:26px;padding:0 2px;font-size:11px;font-weight:700;color:var(--muted);background:var(--field)}
.gx th.n,.gx td.n{position:sticky;left:26px;z-index:2;width:98px;min-width:98px;max-width:98px;text-align:left;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.gx th.n{background:var(--field);padding-inline:8px;font-size:12px}
.gx th.d,.gx td.c{width:46px;min-width:46px}
.gx tr.rv td.n .nb span,.gx tr.rv td.s{color:var(--rv)!important}.gx tr.rl td.n .nb span,.gx tr.rl td.s{color:var(--rl)!important}
.gx tr.rv td.n{background:color-mix(in srgb,var(--rv) 12%,var(--field))}.gx tr.rl td.n{background:color-mix(in srgb,var(--rl) 12%,var(--field))}
.rlg{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);margin:0 0 8px}.rlg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.ar .am.rv{color:var(--rv)}.ar .am.rl{color:var(--rl)}.ast{color:#e8a200;margin-left:4px;font-style:normal;cursor:pointer;padding:2px}
.anote{padding:6px 12px 8px 40px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);background:var(--surface);white-space:pre-wrap}
.rbt{display:flex;gap:8px;margin:10px 0}.rbt button{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px/1.2 var(--body);cursor:pointer}.rbt button.on.v{border-color:var(--rv);color:var(--rv);background:color-mix(in srgb,var(--rv) 14%,var(--surface))}.rbt button.on.l{border-color:var(--rl);color:var(--rl);background:color-mix(in srgb,var(--rl) 14%,var(--surface))}
@media (min-width:1600px){html{zoom:1.3}}
.nst{position:absolute;top:2px;right:5px;font-size:12px;line-height:1;color:#e8a200;font-style:normal;pointer-events:none}
.nst.bl{animation:nbl 1s ease-in-out infinite}
@keyframes nbl{0%,100%{opacity:1}50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.nst.bl{animation:none}}
.gx th.lk .dy{position:relative}.gx th.lk .dy::after{content:'\1F512';position:absolute;top:-1px;right:-10px;font-size:8px;line-height:1}
.lkb{margin-top:14px;padding:12px;border-radius:12px;background:var(--a-soft);font-size:13px;color:var(--ink)}
.lkb p{margin:0 0 8px}
.mo{display:block;min-height:12px;font-size:10px;font-weight:600;color:var(--muted);line-height:12px}
.dy{display:block;font-size:14px;font-weight:700;color:var(--ink);line-height:18px}
.tw{scroll-snap-type:x proximity;scroll-padding-left:124px;scroll-padding-right:44px}
.gx th.d,.gx td.c{scroll-snap-align:start}
.gx td.c{background:color-mix(in srgb,var(--a) 7%,var(--surface))}
.gx th.d{background:color-mix(in srgb,var(--a) 16%,var(--field))}
.gx th.cur{background:var(--a-soft)}
.gx th.cur .dy{color:var(--a)}
.gx td.cur{background:var(--a-soft)}
.gx tr.tt td{height:34px;background:var(--field);color:var(--muted);font-weight:700;font-size:12px;vertical-align:middle}
.gx tr.tt td.n{background:var(--field);padding-inline:8px}
.gx td.em{padding:16px;text-align:left;color:var(--muted);white-space:normal;position:static;width:auto;max-width:none;box-shadow:none}

.nb{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;min-height:48px;padding:4px 8px;border:0;background:transparent;color:var(--ink);font:600 14px/1.25 var(--body);text-align:left;cursor:pointer}
.fr{font-size:11px;font-weight:500;color:var(--muted)}

.bx{position:relative;display:grid;place-items:center;width:100%;height:48px;padding:0;border:0;background:transparent;cursor:pointer}
.bxv{display:grid;place-items:center;width:24px;height:24px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font:800 15px/1 var(--body);color:transparent}
.bx:hover .bxv{border-color:var(--a)}
.bx[data-s="p"] .bxv{border-color:var(--a);background:var(--a-soft);color:var(--a)}
.bx[data-s="a"] .bxv{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.lg{margin:8px 2px 0;font-size:12px;color:var(--muted)}
button:disabled{cursor:not-allowed;opacity:.55}

[hidden]{display:none!important}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,12,28,.5)}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.ph h2{margin:0;font:800 22px/1.2 var(--display)}
.phl{display:flex;align-items:center;gap:10px;min-width:0}
.xbtn{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--field);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}

.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:14px;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.mt:active{border-color:var(--a)}
.mt .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--a-soft);font-size:22px;line-height:1}
.mt .mtx{display:flex;flex-direction:column;gap:2px}
.mt b{font-size:16px;font-weight:700}
.mt .s{font-size:12px;line-height:1.35;color:var(--muted)}
.mt.w{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:12px}
.mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:12px 14px;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.mi b{font-size:16px}
.mi span{font-size:13px;color:var(--muted)}

.pd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pdl{font:700 17px/1.2 var(--display);text-align:center}
.nbtn{flex:none;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.rc{margin-top:10px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.rh{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;padding:12px 14px;border:0;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer}
.rq{font-weight:700;font-size:16px}
.sel{display:flex;flex-wrap:wrap;gap:6px}
.sc{padding:2px 10px;border-radius:999px;background:var(--a-soft);color:var(--a);font-size:13px;font-weight:600}
.none{color:var(--muted);font-size:13px}
.rt{font-size:12px;font-weight:700;color:var(--muted)}
.pk{border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:1fr 1fr}
.pk .prw{background:var(--surface);border-top:0;box-shadow:inset 0 -1px 0 var(--line),inset -1px 0 0 var(--line);min-width:0}
.pk .prw:nth-child(2n){box-shadow:inset 0 -1px 0 var(--line)}
.pk .prw.on{background:var(--a-soft)}
.pk .prw.wide{grid-column:1/-1;box-shadow:inset 0 -1px 0 var(--line)}
.pk .pr{flex-wrap:nowrap;justify-content:flex-start;align-items:center;gap:4px;padding:3px 4px 3px 6px;min-height:44px;font-size:12.5px;line-height:1.25}
.pk .pn{flex:0 0 16px;font-size:10px;color:var(--muted)}
.pk .pmw{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.pk .pm{overflow-wrap:anywhere}
.pk .pds{display:flex;gap:3px}
.pk .pds .pdc{font-size:9.5px;padding:0 6px}
.pk .pck{flex:0 0 34px}
.pk .pcb{width:20px;height:20px;border-radius:6px;font-size:12px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rt2{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font-family:inherit}
.rt2.open{border-color:var(--dharma);box-shadow:0 0 0 2px var(--dharma-soft)}
.rsel{display:flex;flex-wrap:wrap;gap:4px}
.rg.mini{grid-template-columns:repeat(4,1fr);gap:6px}
.rg.mini .rt2{min-height:0;padding:7px 6px;align-items:center;text-align:center;border-radius:10px}
.rg.mini .rq{font-size:12px;line-height:1.2}
.rg.mini .rsel{display:none}
.rg.mini .rt2:not(.open) .rq{color:var(--muted)}
.pkh{padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted);background:var(--field)}
.pg{padding:6px 14px;background:var(--a-soft);color:var(--a);font:800 15px/1.3 var(--display)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px/1.3 var(--body);text-align:left;cursor:pointer}
.pr[aria-pressed="true"]{background:var(--a-soft);font-weight:700}
.ck{color:var(--a);font-weight:800;min-width:16px;text-align:right}
.prw{border-top:1px solid var(--line);background:var(--surface)}
.prw>.row{display:flex;align-items:stretch}
.prw .pr{border-top:0;flex:1 1 auto;min-width:0;background:transparent}
.prw.on{background:var(--a-soft)}
.prw.on .pm{font-weight:700}
.pck{flex:0 0 58px;display:grid;place-items:center;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer}
.pcb{display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--a);font:800 16px/1 var(--body)}
.prw.on .pcb{border-color:var(--a);background:var(--a-soft)}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pfr{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px;background:var(--a-soft)}
.pfr span{font-size:11px;color:var(--muted);font-weight:600}
.pfr b{font-size:14px;color:var(--ink)}
.hh{margin-top:14px}
.hr2{margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px}
.stp{font-weight:700;color:var(--a)}
.sta{font-weight:700;color:var(--warn)}
.tm{color:var(--muted)}
.gx th.d{cursor:pointer}
.ds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dsc{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--field);text-align:center}
.dsc b{font-size:22px;font-family:var(--display)}
.dsc span{font-size:11px;color:var(--muted)}
.dgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.dg{padding:6px 4px;border-radius:10px;background:var(--a-soft);color:var(--a);text-align:center;font-size:12px;font-weight:700}
.dr{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.dr:last-child{border-bottom:0}
.dr em{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
.fl2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.om{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}
.om.bad{color:var(--warn)}
.fpick{position:relative;display:grid;place-items:center;height:96px;margin-top:12px;border:2px dashed var(--line);border-radius:14px;background:var(--field);color:var(--ink);font-weight:700;font-size:16px;cursor:pointer}
.fpick input{position:absolute;opacity:0;width:1px;height:1px}
.mpl{display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.pvr{display:flex;flex-direction:column;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.pvr:first-child{border-top:0}
.pvr b{color:var(--ink);font-size:14px}
.fl{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.al{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ar{display:grid;grid-template-columns:26px 1fr 40px 44px 54px;align-items:center;gap:4px;width:100%;min-height:44px;padding:4px 10px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px/1.25 var(--body);text-align:left;cursor:pointer}
.ar>span:nth-child(n+3){text-align:center}
.ar.ah{min-height:30px;border-top:0;background:var(--field);color:var(--muted);font-size:11px;font-weight:700;cursor:default}
.an{font-size:12px;font-weight:700;color:var(--muted)}
.am{font-weight:600;border-left:3px solid var(--a);padding-left:8px}
.ap{font-weight:800;color:var(--a)}
.ax{font-weight:700;color:var(--warn)}
.hl{border:1px solid var(--line);border-radius:10px;padding:2px 12px;background:var(--field);max-height:34vh;overflow:auto}
.hp{padding:8px 14px 12px;background:var(--field);border-top:1px dashed var(--line)}
.hi{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.hi:last-child{border-bottom:0}
.hd{font-weight:700;color:var(--ink)}
.hn{margin-top:2px;color:var(--muted);white-space:pre-wrap}
.he{color:var(--muted);font-size:13px}
.pn{flex:0 0 22px;font-size:12px;font-weight:700;color:var(--muted)}
.pm{flex:1 1 auto;min-width:0}
.pds{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;max-width:46%}

  function nkey(n){
    var t=tlText(String(n||'')).toLowerCase().replace(/[^a-z]/g,'');
    t=t.replace(/ph/g,'f').replace(/sh/g,'s').replace(/h/g,'').replace(/w/g,'v').replace(/y/g,'').replace(/e/g,'i').replace(/o/g,'u').replace(/(.)\1+/g,'$1');
    return t;
  }
  function impPlan(){
    var list=impRows(),by={},add=[],upd=[],chk=[],same=0,seen={},used={};
    members.forEach(function(m){var k=nkey(m.name);if(k)(by[k]=by[k]||[]).push(m);});
    var digits=function(v){return String(v||'').replace(/\D/g,'');};
    list.forEach(function(x){
      var k=nkey(x.name);if(!k)return;
      var sk=k+'|'+x.dob+'|'+nkey(x.village)+'|'+digits(x.mobile)+'|'+x.group;
      if(seen[sk])return;seen[sk]=1;
      var c=by[k];
      if(!c){add.push(x);return;}
      c.forEach(function(m){
        var sc=0,hard=false;
        if(x.dob&&m.dob){if(x.dob===m.dob)sc+=3;else hard=true;}
        if(x.mobile&&m.mobile){if(digits(x.mobile)===digits(m.mobile))sc+=3;else sc-=1;}
        if(x.village&&m.village){if(nkey(x.village)===nkey(m.village))sc+=2;else hard=true;}
        if(x.father&&m.father){if(nkey(x.father)===nkey(m.father))sc+=3;else hard=true;}
        if(x.group===m.group)sc+=1;
        m._s=sc;m._h=hard;
      });
      var ok=c.filter(function(m){return !m._h&&!used[m.id];});
      if(!ok.length){chk.push(x);return;}
      ok.sort(function(a,b){return b._s-a._s;});
      if(ok.length>1&&ok[0]._s===ok[1]._s){chk.push(x);return;}
      var m=ok[0],patch={};used[m.id]=1;
      if(x.dob&&x.dob!==m.dob)patch.dob=x.dob;
      if(x.mobile&&x.mobile!==m.mobile)patch.mobile=x.mobile;
      if(x.father&&(!m.father||nkey(x.father)!==nkey(m.father)))patch.father=x.father;
      if(x.village&&(!m.village||nkey(x.village)!==nkey(m.village)))patch.village=x.village;
      if(x.seva&&x.seva!==m.seva)patch.seva=x.seva;
      if(x.gx&&x.gx!==m.group)patch.group=x.gx;
      if(Object.keys(patch).length)upd.push({id:m.id,patch:patch});else same++;
    });
    return {add:add,upd:upd,same:same,chk:chk};
  }

  document.addEventListener('click',function(e){

    if(act==='close'){saveNote();sheet=null;confirmDel=false;renderSheet(true);return;}
    if(act==='go'){
      sheet=b.dataset.to;

    }
    if(act==='cardopen'){sheet='card';renderSheet(true);return;}

      var pd=parse(progDate);pd.setDate(pd.getDate()+Number(b.dataset.d));progDate=iso(pd);

    if(act==='lockday'||act==='unlockyes'||act==='unlockask'||act==='unlockno'){
      if(act==='unlockask'){unlockAsk=true;renderSheet(true);return;}
      if(act==='unlockno'){unlockAsk=false;renderSheet(true);return;}

    /* Fallback store: works when the file is opened on its own (saves in this browser). Replaced by the real claude.ai database when published as an Artifact. */
    var LSK='hj_localdb_v1',store=null,subs={},usingLocal=true;
    try{store=JSON.parse(localStorage.getItem(LSK)||'null');}catch(e){store=null;}
    if(!store||!store.c)store={c:{members:DATA.members||{},att:DATA.att||{}}};
    function persist(){try{localStorage.setItem(LSK,JSON.stringify(store));}catch(e){}}
    function colOf(c){return store.c[c]||(store.c[c]={});}
    function csnap(c){var o=colOf(c);return {docs:Object.keys(o).map(function(k){return {id:k,data:function(){return o[k];}};})};}
    function dsnap(c,id){var v=colOf(c)[id];return {exists:v!==undefined,data:function(){return v===undefined?null:v;}};}
    function fire(c,id){
      (subs['c:'+c]||[]).forEach(function(f){try{f(csnap(c));}catch(e){}});
      (subs['d:'+c+'/'+id]||[]).forEach(function(f){try{f(dsnap(c,id));}catch(e){}});
    }
    function sub(k,f,get){(subs[k]=subs[k]||[]).push(f);setTimeout(function(){f(get());},0);}
    var copy=function(o){return JSON.parse(JSON.stringify(o));};
    var localDb={
      collection:function(c){return {
        onSnapshot:function(f){sub('c:'+c,f,function(){return csnap(c);});},
        add:function(d){var id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);colOf(c)[id]=copy(d);persist();fire(c,id);return Promise.resolve({id:id});}
      };},
      doc:function(path){var p=path.split('/'),c=p[0],id=p[1];return {
        onSnapshot:function(f){sub('d:'+path,f,function(){return dsnap(c,id);});},
        set:function(d){colOf(c)[id]=copy(d);persist();fire(c,id);return Promise.resolve();},
        update:function(d){var o=colOf(c)[id]||{};Object.keys(d).forEach(function(k){o[k]=d[k];});colOf(c)[id]=copy(o);persist();fire(c,id);return Promise.resolve();},
        delete:function(){delete colOf(c)[id];persist();fire(c,id);return Promise.resolve();}
      };}
    };
    var cl={use:function(n){
      if(n==='db')return Promise.resolve(localDb);
      if(n==='user')return Promise.resolve({can:function(){return true;}});
      return Promise.resolve(null);}};
    /* ---- Own-hosting mode: Firebase sign-in + shared database (used when firebase-config.js is filled in) ---- */
    function gateUI(html){
      var g=document.getElementById('gate');
      if(!g){g=document.createElement('div');g.id='gate';g.style.cssText='position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:inherit;text-align:center';document.body.appendChild(g);}
      g.innerHTML='<div style="max-width:340px">'+html+'</div>';return g;
    }
    function gateBtn(label,id){return '<button id="'+id+'" style="margin-top:16px;height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--dharma);color:var(--on-accent);font:700 16px inherit;cursor:pointer">'+label+'</button>';}
    async function fbSignIn(auth){
      return new Promise(function(res){
        gateUI('<h2 style="margin:0 0 8px">\u0ab8\u0abe\u0a87\u0aa8 \u0a87\u0aa8 \u0a95\u0ab0\u0acb</h2><p style="margin:0;color:var(--muted)">\u0ab9\u0abe\u0a9c\u0ab0\u0ac0 \u0a9c\u0acb\u0ab5\u0abe \u0a85\u0aa8\u0ac7 \u0aa8\u0acb\u0a82\u0aa7\u0ab5\u0abe \u0aae\u0abe\u0a9f\u0ac7 Google \u0aa5\u0ac0 \u0ab8\u0abe\u0a87\u0aa8 \u0a87\u0aa8 \u0a95\u0ab0\u0acb.</p>'+gateBtn('Google \u0aa5\u0ac0 \u0ab8\u0abe\u0a87\u0aa8 \u0a87\u0aa8','gbtn')+'<p id="gerr" style="color:#B3261E;margin-top:12px"></p>');
        document.getElementById('gbtn').onclick=function(){
          var pr=new firebase.auth.GoogleAuthProvider();
          auth.signInWithPopup(pr).then(function(){res(auth.currentUser);}).catch(function(err){
            if(err&&(err.code==='auth/popup-blocked'||err.code==='auth/operation-not-supported-in-this-environment'))auth.signInWithRedirect(pr);
            else document.getElementById('gerr').textContent=(err&&err.message)||'Sign-in failed';
          });
        };
      });
    }
    async function fbInit(){
      firebase.initializeApp(window.FIREBASE_CONFIG);
      var auth=firebase.auth(),fs=firebase.firestore();
      try{await fs.enablePersistence({synchronizeTabs:true});}catch(e){}
      var u=await new Promise(function(res){var off=auth.onAuthStateChanged(function(x){off();res(x);});});
      if(!u)u=await fbSignIn(auth);
      try{
        var r=await fs.doc('meta/init').get();
        if(!r.exists){
          var b=fs.batch();
          Object.keys(DATA.members||{}).forEach(function(k){b.set(fs.doc('members/'+k),DATA.members[k]);});
          if(window.SEED_ATTENDANCE!==false)Object.keys(DATA.att||{}).forEach(function(k){b.set(fs.doc('att/'+k),DATA.att[k]);});
          b.set(fs.doc('meta/init'),{at:Date.now()});
          await b.commit();
        }
      }catch(err){
        if(err&&err.code==='permission-denied'){
          gateUI('<h2 style="margin:0 0 8px">\u0a86 \u0a8f\u0a95\u0abe\u0a89\u0aa8\u0acd\u0a9f\u0aa8\u0ac7 \u0aaa\u0acd\u0ab0\u0ab5\u0ac7\u0ab6\u0aa8\u0ac0 \u0aae\u0a82\u0a9c\u0ac2\u0ab0\u0ac0 \u0aa8\u0aa5\u0ac0.</h2><p style="margin:0;color:var(--muted)">'+(u.email||'')+'</p>'+gateBtn('\u0aac\u0ac0\u0a9c\u0abe \u0a8f\u0a95\u0abe\u0a89\u0aa8\u0acd\u0a9f\u0aa5\u0ac0 \u0ab8\u0abe\u0a87\u0aa8 \u0a87\u0aa8','gout'));
          document.getElementById('gout').onclick=function(){auth.signOut().then(function(){location.reload();});};
          return new Promise(function(){});
        }
      }
      var g=document.getElementById('gate');if(g)g.remove();
      return {use:function(n){
        if(n==='db')return Promise.resolve(fs);
        if(n==='user')return Promise.resolve({can:function(){return true;}});
        if(n==='downloads')return Promise.resolve({save:function(o){
          var blob=o.data instanceof Blob?o.data:new Blob([o.data]);
          var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
          setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);return Promise.resolve();}});
        return Promise.resolve(null);}};
    }
    /* Use the real claude.ai runtime when the page is published as an Artifact (saving works); the built-in stub above is only a read-only fallback for opening the file locally. */
    if(window.claude&&typeof window.claude.use==='function'){cl=window.claude;usingLocal=false;}
    else if(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&String(window.FIREBASE_CONFIG.apiKey).indexOf('PASTE')!==0&&window.firebase){
      try{cl=await fbInit();usingLocal=false;}catch(err){console.error(err);}
    }
    try{db=cl?await cl.use('db'):null;}catch(e){db=null;}
    if(usingLocal)showNote('Firebase \u0a9c\u0acb\u0aa1\u0abe\u0aaf\u0ac1\u0a82 \u0aa8\u0aa5\u0ac0, \u0aa4\u0ac7\u0aa5\u0ac0 \u0ab9\u0abe\u0a9c\u0ab0\u0ac0 \u0aab\u0a95\u0acd\u0aa4 \u0a86 \u0aa1\u0abf\u0ab5\u0abe\u0a87\u0ab8\u0aae\u0abe\u0a82 \u0ab8\u0abe\u0a9a\u0ab5\u0abe\u0aaf \u0a9b\u0ac7. firebase-config.js \u0aad\u0ab0\u0acb.',false);
    var user=null;
    try{user=cl?await cl.use('user'):null;}catch(e){user=null;}
    try{dls=cl?await cl.use('downloads'):null;}catch(e){dls=null;}
    if(!db){
      loaded=true;attLoaded=true;canWrite=false;
      showNote('\u0ab9\u0abe\u0a9c\u0ab0\u0ac0 \u0ab8\u0abe\u0a9a\u0ab5\u0ab5\u0abe \u0aae\u0abe\u0a9f\u0ac7 \u0a86 \u0aaa\u0ac7\u0a9c \u0ab8\u0abe\u0a87\u0aa8 \u0a87\u0aa8 \u0a95\u0ab0\u0ac0\u0aa8\u0ac7 \u0a96\u0acb\u0ab2\u0acb.',true);
      render();return;
    }
    if(user){
      try{var cw=await Promise.resolve(user.can('data.write'));if(cw===false)canWrite=false;}catch(e){}
    }
    if(!canWrite)void 0;
    db.collection('members').onSnapshot(function(snap){
      members=snap.docs.map(function(d){var v=d.data()||{};return {id:d.id,name:String(v.name||''),group:'dharma',order:Number(v.order)||0,dob:String(v.dob||'').slice(0,4),mobile:String(v.mobile||''),village:String(v.village||''),seva:String(v.seva||''),role:(v.role==='vakta'||v.role==='leader')?v.role:'',father:String(v.father||'')};})
        .filter(function(m){return m.name;})
        .sort(function(a,b){return a.order-b.order||a.name.localeCompare(b.name);});
      loaded=true;render();
    },function(){loaded=true;onErr();render();});
    db.collection('att').onSnapshot(function(snap){
      var next={};
      snap.docs.forEach(function(d){
        var v=d.data();
        if(!v||typeof v.date!=='string'||typeof v.mid!=='string')return;
        next[d.id]={date:v.date,mid:v.mid,present:!!v.present,absent:!!v.absent,roles:Array.isArray(v.roles)?v.roles:[],note:String(v.note||''),at:String(v.at||'')};
      });
      att=next;attLoaded=true;render();
    },function(){attLoaded=true;onErr();render();});
    db.doc('meta/locks').onSnapshot(function(s){
      var v=s.exists?s.data():null,n={};
      ((v&&Array.isArray(v.dates))?v.dates:[]).forEach(function(d){n[d]=true;});
      locks=n;render();
    },function(){});
    db.doc('meta/settings').onSnapshot(function(s){
      var v=s.exists?s.data():null;
      startDate=(v&&typeof v.start==='string'&&v.start)?v.start:null;
      if(sheet!=='card'){cardTime=(v&&typeof v.ctime==='string')?v.ctime:'';cardPlace=(v&&typeof v.cplace==='string')?v.cplace:'';}
      render();
    },function(){});
  })();
})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
